<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="imogen">
  <!--
    The imogen mark: a square viewfinder with the aperture punched out of it, and the lens
    sitting in the hole. The same geometry as the web interface's icon and the Android
    drawable, so all three are recognisably the same thing.

    One colour, so it can be used as a template and take the tint of whatever shows it.
  -->
  <path fill-rule="evenodd" d="M17 12 H47 A5 5 0 0 1 52 17 V47 A5 5 0 0 1 47 52 H17 A5 5 0 0 1 12 47 V17 A5 5 0 0 1 17 12 Z M32 21 A11 11 0 1 0 32 43 A11 11 0 1 0 32 21 Z"/>
  <path d="M32 25.5 A6.5 6.5 0 1 0 32 38.5 A6.5 6.5 0 1 0 32 25.5 Z"/>
</svg>
